<!DOCTYPE html>
<html>
<head>
    <title>Ω OMEGA</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let time = 0;
        const particles = [];
        const PARTICLE_COUNT = 8000;

        // Organic face structure
        class FaceParticle {
            constructor() {
                this.reset();
            }
            
            reset() {
                // Start random
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = 0;
                this.vy = 0;
                this.life = Math.random();
                this.size = Math.random() * 3 + 1;
                
                // Target position on face
                this.setFaceTarget();
            }
            
            setFaceTarget() {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const scale = Math.min(canvas.width, canvas.height) * 0.35;
                
                // Face regions
                const regions = [
                    // Left eye
                    { x: cx - scale * 0.25, y: cy - scale * 0.1, r: scale * 0.12, weight: 0.15 },
                    // Right eye  
                    { x: cx + scale * 0.25, y: cy - scale * 0.1, r: scale * 0.12, weight: 0.15 },
                    // Nose
                    { x: cx, y: cy + scale * 0.05, r: scale * 0.08, weight: 0.1 },
                    // Mouth
                    { x: cx, y: cy + scale * 0.25, r: scale * 0.15, weight: 0.15 },
                    // Face outline
                    { x: cx, y: cy, r: scale * 0.4, weight: 0.45 }
                ];
                
                // Pick region based on weight
                const rand = Math.random();
                let cumWeight = 0;
                let selected = regions[regions.length - 1];
                
                for (let r of regions) {
                    cumWeight += r.weight;
                    if (rand <= cumWeight) {
                        selected = r;
                        break;
                    }
                }
                
                // Position within region with organic distribution
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.pow(Math.random(), 0.5) * selected.r;
                
                this.tx = selected.x + Math.cos(angle) * dist;
                this.ty = selected.y + Math.sin(angle) * dist * 1.3; // Oval face
            }
            
            update() {
                // Organic movement toward target
                const dx = this.tx - this.x;
                const dy = this.ty - this.y;
                
                // Spring-like attraction
                this.vx += dx * 0.001;
                this.vy += dy * 0.001;
                
                // Organic noise
                this.vx += Math.sin(time * 2 + this.x * 0.01) * 0.1;
                this.vy += Math.cos(time * 1.5 + this.y * 0.01) * 0.1;
                
                // Damping
                this.vx *= 0.95;
                this.vy *= 0.95;
                
                this.x += this.vx;
                this.y += this.vy;
                
                // Pulsing life
                this.life = 0.5 + Math.sin(time * 3 + this.x * 0.005) * 0.5;
            }
            
            draw() {
                // Cyan to blue gradient based on position
                const cy = canvas.height / 2;
                const distFromCenter = Math.abs(this.y - cy) / (canvas.height * 0.3);
                
                const r = Math.floor(0 * (1 - distFromCenter) + 100 * distFromCenter);
                const g = Math.floor(255 * (1 - distFromCenter) + 200 * distFromCenter);
                const b = 255;
                
                const alpha = this.life * 0.8;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.fill();
                
                // Glow
                if (this.life > 0.7) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`;
                    ctx.fill();
                }
            }
        }

        // Initialize
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new FaceParticle());
        }

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            // Fade with trail
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Draw eyes (brighter centers)
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) * 0.35;
            
            // Left eye glow
            const leftEyeX = cx - scale * 0.25;
            const leftEyeY = cy - scale * 0.1;
            const eyeGlow = ctx.createRadialGradient(leftEyeX, leftEyeY, 0, leftEyeX, leftEyeY, 60);
            eyeGlow.addColorStop(0, 'rgba(200, 255, 255, 0.8)');
            eyeGlow.addColorStop(0.5, 'rgba(0, 200, 255, 0.4)');
            eyeGlow.addColorStop(1, 'transparent');
            ctx.fillStyle = eyeGlow;
            ctx.beginPath();
            ctx.arc(leftEyeX, leftEyeY, 60, 0, Math.PI * 2);
            ctx.fill();
            
            // Right eye glow
            const rightEyeX = cx + scale * 0.25;
            const rightEyeY = cy - scale * 0.1;
            const eyeGlow2 = ctx.createRadialGradient(rightEyeX, rightEyeY, 0, rightEyeX, rightEyeY, 60);
            eyeGlow2.addColorStop(0, 'rgba(200, 255, 255, 0.8)');
            eyeGlow2.addColorStop(0.5, 'rgba(0, 200, 255, 0.4)');
            eyeGlow2.addColorStop(1, 'transparent');
            ctx.fillStyle = eyeGlow2;
            ctx.beginPath();
            ctx.arc(rightEyeX, rightEyeY, 60, 0, Math.PI * 2);
            ctx.fill();
        }

        animate();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles.forEach(p => p.setFaceTarget());
        });
    </script>
</body>
</html>
