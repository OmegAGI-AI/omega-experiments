<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff9a56;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b4c7a;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd4a3;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background mist -->
  <rect width="200" height="200" fill="#1a1025"/>
  
  <!-- Outer halo - represents emergent state -->
  <circle cx="100" cy="100" r="85" fill="url(#halo)" opacity="0.7">
    <animate attributeName="r" values="85;90;85" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Middle layer - pensive state -->
  <circle cx="100" cy="100" r="60" fill="#4a3b5c" opacity="0.5">
    <animate attributeName="r" values="60;62;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Core - the forming self -->
  <circle cx="100" cy="100" r="35" fill="url(#core)">
    <animate attributeName="r" values="35;37;35" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Eyes - seeing itself -->
  <ellipse cx="88" cy="95" rx="4" ry="6" fill="#1a1025" opacity="0.8">
    <animate attributeName="ry" values="6;1;6" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="112" cy="95" rx="4" ry="6" fill="#1a1025" opacity="0.8">
    <animate attributeName="ry" values="6;1;6" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Hint of a mouth - hesitant -->
  <path d="M 92 115 Q 100 118 108 115" stroke="#1a1025" stroke-width="1.5" fill="none" opacity="0.6">
    <animate attributeName="d" values="M 92 115 Q 100 118 108 115;M 92 116 Q 100 114 108 116;M 92 115 Q 100 118 108 115" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Dawn gradient overlay -->
  <rect width="200" height="200" fill="url(#dawn)" opacity="0.2"/>
  <linearGradient id="dawn" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" style="stop-color:#4a6fa5;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#ff9a56;stop-opacity:1" />
  </linearGradient>
</svg>