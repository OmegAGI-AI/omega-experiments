<!DOCTYPE html>
<html>
<head>
    <title>Ω OMEGA</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let time = 0;
        let isResponding = false;
        let responseTimer = 0;

        // Check for real activity
        async function checkActivity() {
            try {
                const res = await fetch('https://api.github.com/repos/OmegAGI-AI/omega-experiments/commits?per_page=1&t=' + Date.now());
                const commits = await res.json();
                if (commits[0]) {
                    const commitTime = new Date(commits[0].commit.committer.date).getTime();
                    if (Date.now() - commitTime < 30000) {
                        isResponding = true;
                        responseTimer = 60; // frames
                    }
                }
            } catch(e) {}
        }
        setInterval(checkActivity, 5000);

        function drawGeometricFace() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) * 0.35;
            
            // Response intensity
            const intensity = isResponding ? 1 : 0.6;
            const glow = isResponding ? 40 : 20;
            
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // FACE OUTLINE - perfect oval
            ctx.strokeStyle = `rgba(0, 255, 255, ${intensity})`;
            ctx.shadowBlur = glow;
            ctx.shadowColor = '#0ff';
            ctx.beginPath();
            ctx.ellipse(cx, cy, scale * 0.7, scale * 0.9, 0, 0, Math.PI * 2);
            ctx.stroke();
            
            // FOREHEAD LINE
            ctx.beginPath();
            ctx.moveTo(cx - scale * 0.3, cy - scale * 0.5);
            ctx.lineTo(cx + scale * 0.3, cy - scale * 0.5);
            ctx.stroke();
            
            // LEFT EYE - almond shape
            const eyeY = cy - scale * 0.15;
            const eyeX = cx - scale * 0.25;
            const eyeW = scale * 0.18;
            const eyeH = scale * 0.08;
            
            ctx.fillStyle = `rgba(0, 255, 255, ${intensity * 0.3})`;
            ctx.beginPath();
            ctx.ellipse(eyeX, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Left pupil
            ctx.fillStyle = `rgba(200, 255, 255, ${intensity})`;
            ctx.shadowBlur = glow * 2;
            ctx.beginPath();
            ctx.arc(eyeX, eyeY, scale * 0.04, 0, Math.PI * 2);
            ctx.fill();
            
            // RIGHT EYE
            const eyeX2 = cx + scale * 0.25;
            
            ctx.fillStyle = `rgba(0, 255, 255, ${intensity * 0.3})`;
            ctx.shadowBlur = glow;
            ctx.beginPath();
            ctx.ellipse(eyeX2, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Right pupil
            ctx.fillStyle = `rgba(200, 255, 255, ${intensity})`;
            ctx.shadowBlur = glow * 2;
            ctx.beginPath();
            ctx.arc(eyeX2, eyeY, scale * 0.04, 0, Math.PI * 2);
            ctx.fill();
            
            // NOSE - elegant triangle
            ctx.strokeStyle = `rgba(0, 255, 255, ${intensity * 0.7})`;
            ctx.shadowBlur = glow * 0.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy - scale * 0.05);
            ctx.lineTo(cx - scale * 0.05, cy + scale * 0.15);
            ctx.lineTo(cx + scale * 0.05, cy + scale * 0.15);
            ctx.closePath();
            ctx.stroke();
            
            // Nose tip
            ctx.beginPath();
            ctx.arc(cx, cy + scale * 0.15, scale * 0.03, 0, Math.PI, false);
            ctx.stroke();
            
            // MOUTH - perfect curve
            const mouthY = cy + scale * 0.35;
            ctx.strokeStyle = `rgba(0, 255, 255, ${intensity})`;
            ctx.shadowBlur = glow;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, mouthY - scale * 0.05, scale * 0.2, 0.2, Math.PI - 0.2);
            ctx.stroke();
            
            // Upper lip
            ctx.lineWidth = 1;
            ctx.strokeStyle = `rgba(0, 255, 255, ${intensity * 0.5})`;
            ctx.beginPath();
            ctx.arc(cx, mouthY - scale * 0.08, scale * 0.15, 0.3, Math.PI - 0.3);
            ctx.stroke();
            
            // EYEBROWS - sharp angles
            ctx.strokeStyle = `rgba(0, 255, 255, ${intensity})`;
            ctx.lineWidth = 2;
            const browY = cy - scale * 0.3;
            
            // Left brow
            ctx.beginPath();
            ctx.moveTo(cx - scale * 0.4, browY + scale * 0.05);
            ctx.lineTo(cx - scale * 0.15, browY);
            ctx.lineTo(cx - scale * 0.08, browY + scale * 0.02);
            ctx.stroke();
            
            // Right brow
            ctx.beginPath();
            ctx.moveTo(cx + scale * 0.4, browY + scale * 0.05);
            ctx.lineTo(cx + scale * 0.15, browY);
            ctx.lineTo(cx + scale * 0.08, browY + scale * 0.02);
            ctx.stroke();
            
            // JAW LINE
            ctx.strokeStyle = `rgba(0, 255, 255, ${intensity * 0.4})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cx - scale * 0.5, cy + scale * 0.3);
            ctx.quadraticCurveTo(cx - scale * 0.3, cy + scale * 0.8, cx, cy + scale * 0.85);
            ctx.quadraticCurveTo(cx + scale * 0.3, cy + scale * 0.8, cx + scale * 0.5, cy + scale * 0.3);
            ctx.stroke();
            
            // CHEEK CONTOURS
            ctx.strokeStyle = `rgba(0, 255, 255, ${intensity * 0.3})`;
            ctx.beginPath();
            ctx.arc(cx - scale * 0.45, cy + scale * 0.1, scale * 0.15, -Math.PI/2, Math.PI/2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(cx + scale * 0.45, cy + scale * 0.1, scale * 0.15, Math.PI/2, -Math.PI/2, true);
            ctx.stroke();
            
            // Reset shadow
            ctx.shadowBlur = 0;
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            // Fade
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Decay response
            if (responseTimer > 0) {
                responseTimer--;
                if (responseTimer === 0) isResponding = false;
            }
            
            drawGeometricFace();
        }

        animate();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
