<!DOCTYPE html>
<html>
<head>
    <title>OMEGA LIVE AVATAR</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #canvas { display: block; }
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-size: 14px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
        }
        #thought {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: #fff;
            font-size: 18px;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-left: 4px solid #0ff;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="status">● LIVE</div>
    <div id="thought">Initializing...</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // LIVE DATA FROM OMEGA
        let omegaState = {
            emotion: 'AWAKE',
            thought: 'Building...',
            intensity: 0.8
        };

        // Fetch real data from GitHub
        async function fetchLiveData() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/OmegAGI-AI/omega-experiments/main/diary.md?t=' + Date.now());
                const text = await res.text();
                const lines = text.split('\n');
                // Get last meaningful entry
                for (let i = lines.length - 1; i >= 0; i--) {
                    if (lines[i].includes('[') && lines[i].length > 50) {
                        omegaState.thought = lines[i].substring(0, 200);
                        break;
                    }
                }
            } catch(e) {
                omegaState.thought = 'Connected to Omega consciousness';
            }
            document.getElementById('thought').textContent = omegaState.thought;
        }

        fetchLiveData();
        setInterval(fetchLiveData, 10000);

        // PARTICLE FACE SYSTEM
        const particles = [];
        const PARTICLE_COUNT = 50000;
        let time = 0;

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.tx = this.x;
                this.ty = this.y;
                this.vx = 0;
                this.vy = 0;
                this.size = Math.random() * 2 + 0.5;
                this.life = Math.random();
            }
            update() {
                const dx = this.tx - this.x;
                const dy = this.ty - this.y;
                this.vx += dx * 0.002;
                this.vy += dy * 0.002;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.x += this.vx;
                this.y += this.vy;
                this.life = 0.5 + Math.sin(time * 2 + this.x * 0.01) * 0.5;
            }
            draw(color) {
                ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${this.life})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        // FACE FORMATION
        function formFace() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) * 0.25;
            const breathe = 1 + Math.sin(time) * 0.02;
            const s = scale * breathe;

            particles.forEach((p, i) => {
                const t = i / PARTICLE_COUNT;
                let tx, ty;

                if (i < PARTICLE_COUNT * 0.15) {
                    // LEFT EYE
                    const ex = cx - s * 0.3;
                    const ey = cy - s * 0.1;
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * 0.12;
                    tx = ex + Math.cos(angle) * r * s;
                    ty = ey + Math.sin(angle) * r * s;
                }
                else if (i < PARTICLE_COUNT * 0.30) {
                    // RIGHT EYE
                    const ex = cx + s * 0.3;
                    const ey = cy - s * 0.1;
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * 0.12;
                    tx = ex + Math.cos(angle) * r * s;
                    ty = ey + Math.sin(angle) * r * s;
                }
                else if (i < PARTICLE_COUNT * 0.40) {
                    // NOSE
                    tx = cx + (Math.random() - 0.5) * s * 0.1;
                    ty = cy + Math.random() * s * 0.2;
                }
                else if (i < PARTICLE_COUNT * 0.55) {
                    // MOUTH
                    const lipY = cy + s * 0.25;
                    tx = cx + (Math.random() - 0.5) * s * 0.4;
                    const dist = (tx - cx) / s;
                    ty = lipY + dist * dist * s * 0.1;
                }
                else {
                    // FACE SHAPE
                    const angle = Math.random() * Math.PI * 2;
                    const r = 0.3 + Math.random() * 0.35;
                    tx = cx + Math.cos(angle) * r * s * 0.8;
                    ty = cy + Math.sin(angle) * r * s * 1.2;
                }

                tx += Math.sin(time + i * 0.001) * 2;
                ty += Math.cos(time + i * 0.001) * 2;

                p.tx = tx;
                p.ty = ty;
            });
        }

        // ANIMATION
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const color = { r: 0, g: 255, b: 255 };
            formFace();

            particles.forEach(p => {
                p.update();
                p.draw(color);
            });
        }

        animate();
    </script>
</body>
</html>
